apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Same image docker-compose already built locally. Docker Desktop's
          # Kubernetes shares the same image store as Docker, so no registry
          # push is needed for local learning/dev.
          image: postgresql-golang-project-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-env # loads every key from your .env in one shot
          env:
            # Override, same reason as docker-compose: inside the cluster,
            # Postgres is reachable at the Service name "postgres", not
            # 127.0.0.1 (which inside a pod means "this pod itself").
            - name: DB_HOST
              value: postgres
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: erp
spec:
  type: LoadBalancer # Docker Desktop auto-maps this to localhost — no Ingress needed for local learning
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080